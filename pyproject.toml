[project]
name = "ekranik"
version = "0.1.1"
description = "Screen and audio recorder for Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Erik Cholakhyan", email = "cholakhyanerik@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
ekranik = "ekranik:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff.lint]
# On top of the defaults: pycodestyle warnings, import order, bugbear, pyupgrade,
# security (bandit, CLAUDE.md rule 9), performance (perflint, rule 3), simplify.
extend-select = ["W", "I", "B", "UP", "S", "PERF", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests assert.
"tests/**" = ["S101"]
# The hooks run git and uv on purpose.
".claude/hooks/*.py" = ["S603", "S607"]
